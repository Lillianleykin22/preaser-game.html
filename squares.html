<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ריבועים מכל מיני צבעים</title>
</head>
<style>
    .main_color
    {
        width: 400px;
        height: 400px;
        border: 1px solid black;
        border-radius: 10px;
        margin: 0 auto;
    }
    .btn
    {
        width: 70px;
        height: 70px;
        border: 1px solid red;
        border-radius: 50%;
        display: inline-block;
        margin: 10px;
    }
    .container
    {
        width: 100%;
        text-align: center;
    }
    .btn{
        width: 70px;
        height: 70px;
        border: 1px solid #027602;
        border-radius: 50%;
        display: inline-block;
        margin: 10px;
        cursor: pointer;
        font-size: 30px;
        text-align: center;
        line-height: 60px;
    }
</style>
<body>
<div></div>
<script>
    let el = document.createElement("div");
    el.classList.add("main_color");
    el.id = "bigScreen";
    document.body.appendChild(el);

    let currColor = "";
    let colors = ["#fb4e4e", "#96dc6a", "#3f41ba", "yellow", "purple"];
    let count = {};

    createBtnsPanel();
    showCounters();

    function createBtnsPanel(){
        el = document.createElement("div");
        el.classList.add("container");
        el.id = "container";
        document.body.appendChild(el);

        for (let clr of colors) {
            count[clr] = 0;

            let btn = document.createElement("div");
            btn.classList.add("btn");
            btn.id = "btn_" + clr;
            btn.style.backgroundColor = clr;
            btn.addEventListener("click", function () {
                setBig(clr);
            });
            container.appendChild(btn);
        }
    }

    function setBig(color) {
        if (currColor !== color) {
            let screen = document.getElementById("bigScreen");
            screen.style.backgroundColor = color;
            currColor = color;
            count[color]++;
            showCounters();
        }
    }

    function showCounters() {
        for (let clr of colors) {
            document.getElementById(`btn_${clr}`).innerHTML = count[clr];
        }
    }
</script>
</body>
</html>
