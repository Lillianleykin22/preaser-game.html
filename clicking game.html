<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>הלוחץ המסודר</title>
</head>
<body>
<div class="container">
    <button class="start-new-game">התחל</button>
    <div class="time-screen"></div>
    <div class="score-screen"></div>
    <div class="random-10-numbers-area">
        <div class="number-box"></div>
        <div class="number-box"></div>
        <div class="number-box"></div>
        <div class="number-box"></div>
        <div class="number-box"></div>
        <div class="number-box"></div>
        <div class="number-box"></div>
        <div class="number-box"></div>
        <div class="number-box"></div>
        <div class="number-box"></div>
    </div>
    <div class="results-screen"></div>
    <div class="game-over"></div>
        <button class="play-again">שחק שוב</button>
</div>
<style>
    .container {
        background-color: lightgray;
        border: 1px solid black;
        border-radius: 5px;
        min-width: 120px;
        min-height: 120px;
        margin: 0 auto;
        text-align: center;
        display: flex;
        flex-direction: column;
    }
    .start-new-game {
        order: 0;
        background-color: beige;
        color: #333333;
        text-align: center;
        font-weight: bold;
        border: 1px solid black;
        cursor: pointer;
        outline: none;
        padding: 10px;
        font-size: 20px;
    }
    .results-screen {
        order: 1;
        background-color: antiquewhite;
        margin: 0 auto;
        text-align: center;
        font-weight: bold;
        padding: 10px;
        font-size: 20px;
    }
    .time-screen {
        order: 2;
        background-color: antiquewhite;
        border: 1px solid black;
        border-radius: 5px;
        min-width: 150px;
        min-height: 150px;
        margin: 0 auto;
        text-align: center;
        font-weight: bold;
        padding: 10px;
        font-size: 20px;
    }
    .score-screen {
        order: 3;
        background-color: whitesmoke;
        border: 1px solid black;
        border-radius: 5px;
        min-width: 50px;
        min-height: 50px;
        margin: 0 auto;
        text-align: right;
        font-weight: bold;
        padding: 10px;
        font-size: 20px;
    }
    .random-10-numbers-area {
        order: 4;
        background-color: antiquewhite;
        border: 1px solid black;
        border-radius: 5px;
        min-width: 50px;
        min-height: 50px;
        margin: 0 auto;
        font-weight: bold;
        padding: 10px;
        font-size: 20px;
        display: flex;
        justify-content: center;
    }
    .number-box {
        order: 4;
        border: 1px solid black;
        border-radius: 5px;
        width: 50px;
        height: 50px;
        margin: 0 5px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }
    .game-over {
        order: 10;
        background-color: antiquewhite;
        border: 1px solid black;
        border-radius: 5px;
        min-width: 50px;
        min-height: 50px;
        margin: 0 auto;
        text-align: center;
        font-weight: bold;
        padding: 10px;
        font-size: 20px;
        display: flex;
        justify-content: center;
    }
    .play-again{
        background-color: #befbf9;
        order: 11;
        border: 1px solid black;
        border-radius: 5px;
        min-width: 50px;
        min-height: 50px;
        margin: 0 auto;
        text-align: center;
        font-weight: bold;
        padding: 10px;
        font-size: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
    }
</style>
<script>
    function startGame() {
        startTime = Date.now();
    let numbers = [];
    let boxes = document.querySelectorAll(".number-box");
    for(let i = 0; i < 10; i++) {
    let randomNumber = Math.round(Math.random() * 8999 + 1000);
    numbers.push(randomNumber);
        boxes[i].textContent = numbers[i];
    }
        setInterval(function() {
            let elapsed = Date.now() - startTime;
            let seconds = elapsed / 1000;
            timeDisplay.textContent = seconds.toFixed(1);
        }, 100);
    console.log(numbers);
    }
    let startButton = document.querySelector(".start-new-game");
    startButton.addEventListener("click", startGame);
    let timeDisplay = document.querySelector(".time-screen");
    let startTime;
</script>
</body>
</html>
